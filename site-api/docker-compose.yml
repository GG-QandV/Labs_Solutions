services:
  site:
    image: nginx:1.27-alpine
    container_name: site
    restart: unless-stopped
    mem_limit: 64m
    volumes:
      - ./public:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks: [web]
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=web"
      - "traefik.http.routers.site.rule=Host(`labs.mnemostroma.com`)"
      - "traefik.http.routers.site.entrypoints=websecure"
      - "traefik.http.routers.site.tls.certresolver=le"
      - "traefik.http.routers.site.middlewares=sec-headers@file,site-ratelimit@file"
      - "traefik.http.services.site.loadbalancer.server.port=80"

  site-api:
    build: ../site-api
    container_name: site-api
    restart: unless-stopped
    mem_limit: 256m
    env_file: .env
    networks: [web, opsnet]
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=web"
      - "traefik.http.routers.siteapi.rule=Host(`labs.mnemostroma.com`) && PathPrefix(`/api/v1`)"
      - "traefik.http.routers.siteapi.entrypoints=websecure"
      - "traefik.http.routers.siteapi.tls=true"
      - "traefik.http.routers.siteapi.middlewares=sec-headers@file,api-ratelimit@file"
      - "traefik.http.services.siteapi.loadbalancer.server.port=8000"

networks:
  web:
    external: true
  opsnet:
    external: true
