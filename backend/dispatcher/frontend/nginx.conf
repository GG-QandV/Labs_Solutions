server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Same-origin API proxy: the browser only ever talks to this host,
    # so no CORS and no second Traefik router (see Traefik priority pitfall
    # documented in docs/ROADMAP.md — explicit priority overrides the
    # auto-computed one and can be silently lower).
    location /api {
        proxy_pass http://dispatcher-api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /webhooks {
        proxy_pass http://dispatcher-api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /socket.io {
        proxy_pass http://dispatcher-api:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    # OpsHub polls this through Traefik; proxied to the API so the health
    # of the whole stack (db + redis) is what gets reported.
    location = /health {
        proxy_pass http://dispatcher-api:8080/health;
        access_log off;
    }
}
