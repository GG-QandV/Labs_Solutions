# PDF Report Demo — VPS stack (Traefik standalone + OpsHub fleet conventions)
services:
  pdf-demo:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: pdf-demo
    restart: on-failure            # fleet convention: native OOM auto-restart
    mem_limit: 2560m               # fleet convention: enables cgroup OOM protection
    cpus: 2.0
    environment:
      - PUBLIC_BASE_URL=https://pdf-labs.mnemostroma.com
      - RESEND_API_KEY=${RESEND_API_KEY}
      - OPSHUB_URL=http://opshub:8700
      - OPSHUB_KEY=${OPSHUB_KEY}
      - OPSHUB_SERVICE=pdf-demo
      - RENDER_CONCURRENCY=2
    volumes:
      - /srv/demos/pdf-demo/data:/data
    networks: [web, opsnet]
    labels:
      - "demo=true"                                    # OpsHub discovery
      - "traefik.enable=true"
      - "traefik.http.routers.pdfdemo.rule=Host(`pdf-labs.mnemostroma.com`)"
      - "traefik.http.routers.pdfdemo.entrypoints=websecure"
      - "traefik.http.routers.pdfdemo.middlewares=sec-headers@file,noindex@file,demo-ratelimit@file"
      - "traefik.http.routers.pdfdemo.tls.certresolver=le"
      - "traefik.http.services.pdfdemo.loadbalancer.server.port=8080"

networks:
  web:
    external: true                 # created by the Traefik standalone stack
  opsnet:
    external: true                 # created by the OpsHub stack
