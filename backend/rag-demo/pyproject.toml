[project]
name = "rag-demo"
version = "1.0.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "python-multipart>=0.0.12",
  "email-validator>=2.2",
  "httpx>=0.27",
  "numpy>=2.1",
  "onnxruntime>=1.20",
  "tokenizers>=0.20",
  "sqlite-vec>=0.1.6",
  "pdfplumber>=0.11",
  "pypdfium2>=4",
  "python-docx>=1.1",
]
[tool.uv]
package = false

[dependency-groups]
dev = ["pytest>=8.0"]
