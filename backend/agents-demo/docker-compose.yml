# Конвенции парка — см. docs/ARCHITECTURE.md §4. Без demo=true/mem_limit OpsHub
# не управляет сервисом, а без mem_limit не работает нативный OOM-рестарт.
services:
  agents-demo:
    build: .
    container_name: agents-demo
    restart: on-failure
    mem_limit: 256m          # самый лёгкий стек парка: инференс в облаке
    cpus: 0.5
    environment:
      - OPSHUB_URL=http://opshub:8700
      - OPSHUB_KEY=${OPSHUB_KEY}
      - OPSHUB_SERVICE=agents-demo
      - GEMINI_API_KEY=${AGENTS_GEMINI_KEY:-}   # пусто → только режим кэша
      - SPEED=${AGENTS_SPEED:-1.0}
    volumes:
      - /srv/demos/agents-demo/data:/data
    networks: [web, opsnet]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8080/health',timeout=3).status==200 else 1)"]
      interval: 60s
      timeout: 5s
      retries: 3
    labels:
      - "demo=true"
      - "traefik.enable=true"
      - "traefik.docker.network=web"
      - "traefik.http.routers.agentsdemo.rule=Host(`agents-labs.mnemostroma.com`)"
      - "traefik.http.routers.agentsdemo.entrypoints=websecure"
      - "traefik.http.routers.agentsdemo.tls.certresolver=le"
      - "traefik.http.services.agentsdemo.loadbalancer.server.port=8080"

networks:
  web: { external: true }
  opsnet: { external: true }
