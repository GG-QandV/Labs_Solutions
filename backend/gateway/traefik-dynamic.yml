# Traefik file-provider: публикация HTTP-порта шлюза наружу.
# Шлюз живёт на хосте (systemd), а не в Docker, поэтому docker-labels
# неприменимы — кладём в каталог dynamic-конфигов Traefik
# (обычно /srv/traefik/dynamic/, провайдер file + watch: true).
#
# Наружу отдаётся ТОЛЬКО http_listen (8348). TCP 8347 остаётся на 127.0.0.1:
# шлюз не терминирует TLS, снаружи токены пошли бы открытым текстом.

http:
  routers:
    aspgateway:
      rule: "Host(`agentmesh-labs.mnemostroma.com`)"
      entryPoints: [websecure]
      service: aspgateway
      middlewares: [sec-headers@file, noindex@file, demo-ratelimit@file]
      tls:
        certResolver: le

  services:
    aspgateway:
      loadBalancer:
        servers:
          # Адрес хоста в docker-сети `web` (та, в которой сидит Traefik).
          # Проверить: ip -4 addr show | grep br- | grep 172.18
          # http_listen в config.yaml обязан совпадать с этим адресом.
          - url: "http://172.18.0.1:8348"
        passHostHeader: true
